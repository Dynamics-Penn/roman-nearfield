[metadata]
name = roman-nearfield
version = 0.1.0
author = 
author_email = 
description = Shared utilities for Roman Near-Field Cosmology notebooks
long_description = file: README.md
long_description_content_type = text/markdown
license = AGPL-3.0-or-later
url = https://github.com/Dynamics-Penn/roman-nearfield
project_urls =
    Bug Tracker = https://github.com/Dynamics-Penn/roman-nearfield/issues
    Source Code = https://github.com/Dynamics-Penn/roman-nearfield
classifiers =
    Programming Language :: Python :: 3
    License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)
    Operating System :: OS Independent
    Intended Audience :: Science/Research
    Topic :: Scientific/Engineering :: Astronomy

[options]
packages = find:
python_requires = >=3.9
install_requires =
    numpy>=1.22
    scipy>=1.8
    matplotlib>=3.5
    astropy>=5.0
    astroquery>=0.4
    healpy>=1.15
    pandas>=1.4
    skyproj>=1.0
    galstreams>=1.0

[options.extras_require]
test =
    pytest>=7.0
    pytest-cov

[options.package_data]
roman_nearfield =
    py.typed

[tool:pytest]
testpaths = test
